<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartBio Biomedical Equipment Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 430px;
      padding: 40px 25px;
      text-align: center;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 24px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: white;
      color: #1d4ed8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    p {
      margin: 0 0 30px;
      opacity: 0.85;
      line-height: 1.5;
    }

    .open-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #1d4ed8;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .open-btn:hover {
      background: #e0f2fe;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      SB
    </div>

    <h1>SmartBio</h1>

    <p>
      Biomedical Equipment Tracker
    </p>

    <a
      class="open-btn"
      href="https://script.google.com/a/macros/jimsh-nk.org/s/AKfycbyNw5qvqANsOTNTD6lrXG5r2rTzyK3AnSS_Lk26SdaRNOYAX5ERBoUG4dHUEqrhlbTA/exec"
      target="_self">
      Open SmartBio
    </a>

    <div class="small">
      SmartBio Biomedical Equipment Management System
    </div>

  </div>

</body>
</html>
