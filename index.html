<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#1565c0">

<title>SmartBio Biomedical Equipment Tracker</title>

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f8fc;
}

.container{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    box-sizing:border-box;
}

.card{
    width:100%;
    max-width:430px;
    background:#ffffff;
    border-radius:22px;
    padding:35px 25px;
    box-sizing:border-box;
    text-align:center;
    box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.logo{
    width:80px;
    height:80px;
    margin:0 auto 18px;
    border-radius:20px;
    background:linear-gradient(135deg,#1565c0,#42a5f5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(21,101,192,.3);
}

h1{
    margin:0;
    color:#123;
    font-size:23px;
}

.subtitle{
    margin:10px 0 25px;
    color:#64748b;
    font-size:14px;
}

.openBtn{
    display:block;
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#1565c0;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    text-decoration:none;
    box-sizing:border-box;
}

.openBtn:hover{
    background:#0d47a1;
}

.info{
    margin-top:20px;
    font-size:12px;
    color:#64748b;
    line-height:1.6;
}

.spinner{
    width:22px;
    height:22px;
    border:3px solid #dbeafe;
    border-top-color:#1565c0;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            SB
        </div>

        <h1>
            SmartBio Biomedical
            Equipment Tracker
        </h1>

        <div class="subtitle">
            Hospital Biomedical Equipment Management System
        </div>

        <div class="spinner"></div>

        <div style="font-size:13px;color:#64748b;margin-bottom:15px;">
            Opening SmartBio...
        </div>

        <a
            id="openSmartBio"
            class="openBtn"
            href="#"
            target="_blank">
            🚀 Open SmartBio
        </a>

        <div class="info">
            QR Scanner • Equipment • PMS • Calibration<br>
            Documents • Breakdown • AMC/CMC • Reports
        </div>

    </div>

</div>

<script>

const SMARTBIO_APP_URL =
"https://script.google.com/macros/s/AKfcybyuKac_oXfIYKgmz8Nqsvn8BFWCTQWnrOQWbHPB3dUkvbFcOONaOhrZx2V5K-alCCzg/exec";

document.getElementById("openSmartBio").href =
    SMARTBIO_APP_URL;

</script>

</body>
</html>
