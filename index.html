<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SmartBio Biomedical Equipment Tracker</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

#smartbioFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f8fc;
    color:#1565c0;
    font-size:16px;
    font-weight:700;
    z-index:100;
}

.spinner{
    width:25px;
    height:25px;
    border:4px solid #dbeafe;
    border-top-color:#1565c0;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-right:10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   SMARTBIO CAMERA OVERLAY
========================================================= */

#cameraOverlay{
    position:fixed;
    inset:0;
    background:#000;
    z-index:1000;
    display:none;
    flex-direction:column;
}

#cameraTop{
    height:60px;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    box-sizing:border-box;
    flex-shrink:0;
}

#cameraTitle{
    font-size:17px;
    font-weight:700;
}

#cameraClose{
    border:0;
    background:#dc2626;
    color:#fff;
    border-radius:8px;
    padding:9px 14px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

#cameraArea{
    position:relative;
    flex:1;
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
}

#cameraVideo{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#000;
}

#scanBox{
    position:absolute;
    width:min(72vw,300px);
    height:min(72vw,300px);
    max-width:300px;
    max-height:300px;
    border:3px solid #22c55e;
    border-radius:18px;
    box-shadow:
        0 0 0 9999px rgba(0,0,0,.38);
    pointer-events:none;
}

#scanLine{
    position:absolute;
    left:5%;
    right:5%;
    height:3px;
    background:#22c55e;
    top:50%;
    animation:scanMove 2s linear infinite;
}

@keyframes scanMove{
    0%{
        transform:translateY(-120px);
        opacity:.4;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(120px);
        opacity:.4;
    }
}

#cameraBottom{
    background:#111827;
    color:#fff;
    padding:14px;
    text-align:center;
    flex-shrink:0;
}

#cameraStatus{
    font-size:14px;
    margin-bottom:10px;
}

#cameraStart{
    border:0;
    background:#1565c0;
    color:#fff;
    border-radius:9px;
    padding:11px 20px;
    font-weight:700;
    cursor:pointer;
}

#cameraSwitch{
    border:0;
    background:#374151;
    color:#fff;
    border-radius:9px;
    padding:11px 20px;
    font-weight:700;
    cursor:pointer;
    margin-left:7px;
}

#cameraError{
    display:none;
    color:#fecaca;
    background:#7f1d1d;
    padding:10px;
    border-radius:8px;
    margin-top:8px;
    font-size:13px;
}


/* =========================================================
   MOBILE
========================================================= */

#githubQrReader{position:absolute;inset:0;width:100%;height:100%;background:#000;z-index:1;}
#githubQrReader video{width:100% !important;height:100% !important;object-fit:cover !important;}
#cameraVideo{display:none;}
@media(max-width:600px){

    #cameraTop{
        height:56px;
    }

    #cameraTitle{
        font-size:15px;
    }

    #cameraClose{
        padding:8px 11px;
    }

    #cameraBottom{
        padding:12px;
    }

}
</style>
</head>

<body>

<div id="loading">
    <div class="spinner"></div>
    Opening SmartBio...
</div>


<!-- =========================================================
     EXISTING SMARTBIO APPLICATION
========================================================= -->

<iframe
    id="smartbioFrame"
    allow="camera; microphone"
    allowfullscreen>
</iframe>


<!-- =========================================================
     CAMERA OVERLAY
     THIS IS ONLY USED FOR QR SCANNING
========================================================= -->

<div id="cameraOverlay">

    <div id="cameraTop">

        <div id="cameraTitle">
            📷 SmartBio QR Scanner
        </div>

        <button
            id="cameraClose"
            onclick="closeCamera()">
            ✕ Close
        </button>

    </div>


    <div id="cameraArea">

        <div id="githubQrReader"></div>

        <video
            id="cameraVideo"
            autoplay
            muted
            playsinline>
        </video>

        <div id="scanBox">
            <div id="scanLine"></div>
        </div>

    </div>


    <div id="cameraBottom">

        <div id="cameraStatus">
            Point the camera at the equipment QR code.
        </div>

        <button
            id="cameraStart"
            onclick="startCamera()">
            📷 Start Camera
        </button>

        <button
            id="cameraSwitch"
            onclick="switchCamera()">
            🔄 Switch Camera
        </button>

        <div id="cameraError"></div>

    </div>

</div>


<!-- =========================================================
     QR DECODER
========================================================= -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/* =========================================================
   SMARTBIO APPS SCRIPT URL
========================================================= */

const SMARTBIO_APP_URL =
"https://script.google.com/macros/s/AKfycbyuKac_oXfIYKgmz8Nqsvn8BFWCTQWnrOQWbHPB3dUkvbFcOONaOhrZx2V5K-alCCzg/exec";


const frame =
document.getElementById("smartbioFrame");

const loading =
document.getElementById("loading");

/*
   Dedicated QR camera mode.
   When ?qrscanner=1 is present, this GitHub page becomes
   ONLY the camera scanner. It does NOT show SmartBio login.
*/
const QR_SCANNER_MODE =
    new URLSearchParams(window.location.search).get("qrscanner") === "1";


/* =========================================================
   OPEN SMARTBIO
========================================================= */

if(QR_SCANNER_MODE){

    /*
       Scanner popup: do not load the SmartBio iframe/login.
    */
    if(frame){
        frame.style.display = "none";
    }

    if(loading){
        loading.style.display = "none";
    }

    document.title = "SmartBio QR Scanner";

    setTimeout(function(){
        const overlay = document.getElementById("cameraOverlay");
        if(overlay) overlay.style.display = "flex";

        const status = document.getElementById("cameraStatus");
        if(status) status.textContent = "Starting rear camera...";

        startCamera();
    },300);

}else if(
    SMARTBIO_APP_URL.indexOf("PASTE_YOUR_REAL_EXEC_URL_HERE") !== -1
){

    loading.innerHTML =
        "<div style='text-align:center;color:#dc2626'>" +
        "<b>SmartBio URL not configured.</b><br><br>" +
        "Please add your Apps Script Web App /exec URL." +
        "</div>";

}
else{

    frame.src = SMARTBIO_APP_URL;

    frame.onload = function(){

        setTimeout(function(){

            loading.style.display = "none";

        },500);

    };

}


/* =========================================================
   CAMERA VARIABLES
========================================================= */
let qrReader = null;
let cameraRunning = false;
let currentCameraIndex = 0;
let availableCameras = [];
let qrScanLocked = false;

/* =========================================================
   SMARTBIO MESSAGE RECEIVER
========================================================= */
window.addEventListener("message",function(event){

    const data = event.data || {};

    if(data.type === "SMARTBIO_OPEN_QR_SCANNER"){
        openCamera();
        return;
    }

    if(data.type === "SMARTBIO_CLOSE_QR_SCANNER"){
        closeCamera(false);
        return;
    }
});

/* =========================================================
   OPEN CAMERA SCREEN
========================================================= */
function openCamera(){

    const overlay = document.getElementById("cameraOverlay");
    if(!overlay) return;

    overlay.style.display = "flex";

    const status = document.getElementById("cameraStatus");
    if(status) status.textContent = "Starting rear camera...";

    const errorBox = document.getElementById("cameraError");
    if(errorBox){
        errorBox.style.display = "none";
        errorBox.textContent = "";
    }

    qrScanLocked = false;

    /* Tell SmartBio that the GitHub camera screen received the request. */
    sendToSmartBio({
        type:"SMARTBIO_QR_CAMERA_OPENED"
    });

    setTimeout(function(){
        startCamera();
    },120);
}

/* =========================================================
   CLOSE CAMERA
========================================================= */
async function closeCamera(notifySmartBio){
    await stopCamera();
    const overlay = document.getElementById("cameraOverlay");
    if(overlay) overlay.style.display = "none";
    if(notifySmartBio !== false){
        sendToSmartBio({
            type:"SMARTBIO_QR_CANCELLED"
        });
    }

    if(QR_SCANNER_MODE){
        setTimeout(function(){
            try{
                window.close();
            }catch(e){}
        },100);
    }
}

/* =========================================================
   START CAMERA + QR DECODER

   html5-qrcode owns the camera. The old version opened
   getUserMedia() and html5-qrcode separately on the same camera,
   which could make Chrome report that the camera was already in use.
========================================================= */
async function startCamera(){
    const status = document.getElementById("cameraStatus");
    const errorBox = document.getElementById("cameraError");
    if(errorBox) errorBox.style.display = "none";
    qrScanLocked = false;

    try{
        await stopCamera();
        if(!window.isSecureContext) throw new Error("Camera requires a secure HTTPS page.");
        if(!window.Html5Qrcode) throw new Error("QR scanner library is still loading. Please try again.");
        if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("Camera is not supported by this browser.");
        if(status) status.textContent = "Requesting camera permission...";

        try{ availableCameras = await Html5Qrcode.getCameras(); }
        catch(e){ console.warn("Camera list error:",e); availableCameras=[]; }

        const reader = document.getElementById("githubQrReader");
        if(reader){
            reader.innerHTML="";
            reader.style.position="absolute";
            reader.style.inset="0";
            reader.style.width="100%";
            reader.style.height="100%";
            reader.style.zIndex="1";
            reader.style.background="#000";
            reader.style.display="block";
        }

        const oldVideo=document.getElementById("cameraVideo");
        if(oldVideo){ oldVideo.style.display="none"; oldVideo.srcObject=null; }

        qrReader=new Html5Qrcode("githubQrReader");
        const config={
            fps:10,
            qrbox:function(w,h){
                const size=Math.floor(Math.min(w,h)*0.65);
                return {width:Math.min(size,300),height:Math.min(size,300)};
            },
            aspectRatio:1.0,
            disableFlip:false
        };
        let cameraSource=availableCameras.length ? getBestCameraId() : "environment";
        if(status) status.textContent="Starting rear camera...";

        try{
            await qrReader.start(cameraSource,config,function(decodedText){handleQrResult(decodedText);},function(){});
        }catch(firstError){
            console.warn("Preferred camera failed:",firstError);
            try{ if(qrReader){try{await qrReader.clear();}catch(e){}} }catch(e){}
            qrReader=new Html5Qrcode("githubQrReader");
            await qrReader.start({facingMode:"environment"},config,function(decodedText){handleQrResult(decodedText);},function(){});
        }

        cameraRunning=true;
        if(status) status.textContent="Camera ready. Point the QR code inside the green box.";

    }catch(error){
        console.error("SmartBio GitHub camera error:",error);
        cameraRunning=false;
        let message="Unable to start camera.";
        if(error && error.name==="NotAllowedError") message="Camera permission was blocked. Please allow Camera for this GitHub site in Chrome settings.";
        else if(error && error.name==="NotFoundError") message="No camera was found on this device.";
        else if(error && error.name==="NotReadableError") message="The camera is already being used by another app or browser tab.";
        else if(error && error.name==="SecurityError") message="The browser blocked camera access.";
        else if(error && error.message) message=error.message;
        if(status) status.textContent="Camera could not be started.";
        if(errorBox){
            errorBox.textContent=message;
            errorBox.style.display="block";
        }

        sendToSmartBio({
            type:"SMARTBIO_QR_CAMERA_ERROR",
            message:message
        });
    }
}

/* =========================================================
   FIND BEST CAMERA
========================================================= */
function getBestCameraId(){
    if(!availableCameras || !availableCameras.length) return "environment";
    for(let i=0;i<availableCameras.length;i++){
        const label=String(availableCameras[i].label||"").toLowerCase();
        if(label.includes("back")||label.includes("rear")||label.includes("environment")){
            currentCameraIndex=i;
            return availableCameras[i].id;
        }
    }
    currentCameraIndex=0;
    return availableCameras[0].id;
}

/* =========================================================
   SWITCH CAMERA
========================================================= */
async function switchCamera(){
    if(!availableCameras || availableCameras.length<2){
        const status=document.getElementById("cameraStatus");
        if(status) status.textContent="Only one camera is available.";
        return;
    }
    currentCameraIndex++;
    if(currentCameraIndex>=availableCameras.length) currentCameraIndex=0;
    const camera=availableCameras[currentCameraIndex];
    const status=document.getElementById("cameraStatus");
    try{
        if(qrReader){try{await qrReader.stop();}catch(e){} try{await qrReader.clear();}catch(e){}}
        const reader=document.getElementById("githubQrReader");
        if(reader) reader.innerHTML="";
        qrReader=new Html5Qrcode("githubQrReader");
        const config={fps:10,qrbox:function(w,h){const size=Math.floor(Math.min(w,h)*0.65);return {width:Math.min(size,300),height:Math.min(size,300)};},aspectRatio:1.0,disableFlip:false};
        await qrReader.start(camera.id,config,function(decodedText){handleQrResult(decodedText);},function(){});
        cameraRunning=true;
        if(status) status.textContent="Camera switched. Point the QR code inside the green box.";
    }catch(error){
        console.error("Camera switch error:",error);
        if(status) status.textContent="Unable to switch camera.";
    }
}

/* =========================================================
   QR RESULT
========================================================= */
async function handleQrResult(decodedText){
    if(qrScanLocked || !decodedText) return;
    const assetNo=String(decodedText).trim();
    if(!assetNo) return;
    qrScanLocked=true;
    const status=document.getElementById("cameraStatus");
    if(status) status.textContent="QR scanned successfully.";
    await stopCamera();
    sendToSmartBio({
        type:"SMARTBIO_QR_RESULT",
        assetNo:assetNo,
        qrText:assetNo
    });

    setTimeout(function(){

        const overlay =
            document.getElementById("cameraOverlay");

        if(overlay){
            overlay.style.display = "none";
        }

        if(QR_SCANNER_MODE){
            try{
                window.close();
            }catch(e){}
        }

    },350);
}

/* =========================================================
   SEND RESULT TO SMARTBIO IFRAME
========================================================= */
function sendToSmartBio(data){

    try{

        if(QR_SCANNER_MODE && window.opener && !window.opener.closed){

            window.opener.postMessage(
                data,
                "*"
            );

            return;
        }

        if(frame && frame.contentWindow){

            frame.contentWindow.postMessage(
                data,
                "*"
            );
        }

    }catch(error){

        console.error(
            "Unable to send QR result to SmartBio:",
            error
        );

    }
}


/* =========================================================
   STOP CAMERA
========================================================= */
async function stopCamera(){
    cameraRunning=false;
    if(qrReader){try{await qrReader.stop();}catch(e){} try{await qrReader.clear();}catch(e){} qrReader=null;}
    const reader=document.getElementById("githubQrReader");
    if(reader) reader.innerHTML="";
}

</script>

</body>
</html>
