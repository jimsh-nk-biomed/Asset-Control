<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SmartBio Biomedical Equipment Tracker</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

#smartbioFrame{
    width:100%;
    height:100%;
    border:0;
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f4f8fc;
    color:#1565c0;
    font-size:16px;
    font-weight:700;
    z-index:10;
}

.spinner{
    width:25px;
    height:25px;
    border:4px solid #dbeafe;
    border-top-color:#1565c0;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-right:10px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="loading">
    <div class="spinner"></div>
    Opening SmartBio...
</div>

<iframe
    id="smartbioFrame"
    allow="camera; microphone"
    allowfullscreen>
</iframe>

<script>

/*
=========================================================
SMARTBIO APPS SCRIPT WEB APP URL
=========================================================

PASTE YOUR WORKING APPS SCRIPT /exec URL BELOW.

Example:

https://script.google.com/macros/s/XXXXXXXXXXXX/exec

=========================================================
*/

const SMARTBIO_APP_URL =
"https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbyNw5qvqANsOTNTD6lrXG5r2rTzyK3AnSS_Lk26SdaRNOYAX5ERBoUG4dHUEqrhlbTA/exec/exec";


const frame =
document.getElementById("smartbioFrame");

const loading =
document.getElementById("loading");


if(
    SMARTBIO_APP_URL.indexOf("https://script.google.com/macros/s/AKfycbyNw5qvqANsOTNTD6lrXG5r2rTzyK3AnSS_Lk26SdaRNOYAX5ERBoUG4dHUEqrhlbTA/exec") !== -1
){
    loading.innerHTML =
        "<div style='text-align:center;color:#dc2626'>" +
        "<b>SmartBio URL not configured.</b><br><br>" +
        "Please add your Apps Script Web App /exec URL." +
        "</div>";
}
else{

    frame.src = SMARTBIO_APP_URL;

    frame.onload = function(){
        setTimeout(function(){
            loading.style.display = "none";
        },500);
    };

}

</script>

</body>
</html>
